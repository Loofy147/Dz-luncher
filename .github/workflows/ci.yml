name: CI
'on':
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests scripts validation_core.py
      - name: Tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q app scripts validation_core.py

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dz_luncher
          POSTGRES_PASSWORD: dz-luncher-test
          POSTGRES_DB: dz_luncher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dz_luncher -d dz_luncher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://dz_luncher:dz-luncher-test@localhost:5432/dz_luncher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply fresh PostgreSQL migrations
        run: alembic upgrade head
      - name: Confirm migrations are repeatable
        run: alembic upgrade head
      - name: Verify all required domain and operational tables exist
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from app.db import make_engine
          required = {"users", "auth_sessions", "auth_action_tokens", "survey_campaigns", "survey_versions", "survey_responses", "reward_ledger", "reward_obligations", "audit_events", "data_subject_requests", "response_reviews", "response_appeals", "notifications"}
          present = set(inspect(make_engine()).get_table_names())
          missing = sorted(required - present)
          if missing:
              raise SystemExit(f"Missing migrated tables: {missing}")
          print(f"PostgreSQL migration verified; found {len(required)} required domain and operational tables.")
          PY
